name: acceptance and publication
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - name: Locked contracts, regression tests and docs
        run: |
          uv venv .venv
          uv pip sync --python .venv/bin/python --require-hashes requirements-notebooks.txt requirements-build.txt
          uv pip install --python .venv/bin/python --no-deps --no-build-isolation -e cloudless-mosaic -e eopf-sentinel-2
          .venv/bin/python -m unittest discover -s tests
          .venv/bin/mkdocs build --strict
          uv venv .validation-venv
          uv pip sync --python .validation-venv/bin/python --require-hashes requirements-validation.txt
          .validation-venv/bin/python scripts/cwl-docs.py --validate
          uv venv .metadata-venv
          uv pip sync --python .metadata-venv/bin/python --require-hashes requirements-metadata.txt
          .metadata-venv/bin/python scripts/check-metadata.py
      - name: Build matching worker, applications and controller
        run: |
          docker build -t dask-worker:local .
          .venv/bin/python scripts/select-images.py --cloudless dask-worker:local --eopf dask-worker:local
          docker build -f Dockerfile.acceptance --build-arg WORKER_IMAGE=dask-worker:local -t dask-acceptance:local .
      - name: Start pinned Kubernetes and gateway
        run: |
          curl -fsSL https://kind.sigs.k8s.io/dl/v0.29.0/kind-linux-amd64 -o /tmp/kind
          sudo install /tmp/kind /usr/local/bin/kind
          kind create cluster --name dask-acceptance --image kindest/node:v1.33.1@sha256:050072256b9a903bd914c0b2866828150cb229cea0efe5892e2b644d5dd3b34f --wait 120s
          kind load docker-image dask-worker:local dask-acceptance:local --name dask-acceptance
          helm upgrade --install dask-gateway https://helm.dask.org/dask-gateway-2025.4.0.tgz --create-namespace --namespace dask-acceptance -f acceptance/gateway-values.yaml --set gateway.backend.image.name=dask-worker --set gateway.backend.image.tag=local --set traefik.service.type=ClusterIP --wait --timeout 10m
          kubectl apply -n dask-acceptance -f acceptance/controller.yaml
          kubectl wait -n dask-acceptance --for=condition=Ready pod/acceptance-controller --timeout=10m
      - name: Calrissian distributed tasks and teardown
        run: kubectl exec -n dask-acceptance acceptance-controller -- bash scripts/run-gateway-acceptance.sh
      - name: Real cloudless and EOPF notebook acceptance
        run: |
          kubectl exec -n dask-acceptance acceptance-controller -- python scripts/run-practice-labs.py --workspace /workspace/dask-app-package --notebooks-dir . --lab cloudless-mosaic/notebook.ipynb --python-kernel dask_env --output /calrissian/notebooks
          kubectl exec -n dask-acceptance acceptance-controller -- python scripts/run-practice-labs.py --workspace /workspace/dask-app-package --notebooks-dir . --lab eopf-sentinel-2/notebook.ipynb --python-kernel dask_env --output /calrissian/notebooks
          kubectl exec -n dask-acceptance acceptance-controller -- python scripts/check-results.py
          kubectl exec -n dask-acceptance acceptance-controller -- python -c 'from dask_gateway import Gateway; assert not Gateway().list_clusters(), "Clusters leaked after notebooks"'
      - name: Publish accepted candidate or stable artifacts
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_STABLE: ${{ github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main' }}
        run: |
          set -euo pipefail
          version=$(python -c 'import json; print(json.load(open("cloudless-mosaic/codemeta.json"))["version"])')
          tag="$version-rc.$GITHUB_RUN_NUMBER"
          if [ "$PUBLISH_STABLE" = true ]; then
            tag=$version
            if gh release view "$version" >/dev/null 2>&1; then echo 'Release already exists' >&2; exit 1; fi
          fi
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for app in cloudless-mosaic eopf-sentinel-2; do
            image="ghcr.io/eoap/dask-app-package/$app:$tag"
            if docker manifest inspect "$image" >/dev/null 2>&1; then echo 'Image tag already exists' >&2; exit 1; fi
          done
          mkdir downloads
          for app in cloudless-mosaic eopf-sentinel-2; do
            image="ghcr.io/eoap/dask-app-package/$app:$tag"
            docker tag dask-worker:local "$image"
            docker push "$image"
            docker pull "$image"
            docker inspect "$image" --format '{{index .RepoDigests 0}}' > "downloads/$app.image.txt"
          done
          .venv/bin/python scripts/select-images.py --cloudless "$(cat downloads/cloudless-mosaic.image.txt)" --eopf "$(cat downloads/eopf-sentinel-2.image.txt)"
          .validation-venv/bin/python scripts/cwl-docs.py --validate
          cp cwl-workflows/*.cwl downloads/
          cp requirements-*.txt downloads/
          (cd downloads && sha256sum * > SHA256SUMS)
          tar czf "dask-app-package.$tag.tar.gz" -C downloads .
          if [ "$PUBLISH_STABLE" = true ]; then
            gh release create "$version" "dask-app-package.$tag.tar.gz" downloads/* --target "$GITHUB_SHA" --title "$version" --notes 'Standalone typed CWL v1.2, locked Python 3.12 applications and matching Dask Gateway workers, accepted with real cloudless Sentinel-2 and EOPF processing on Kubernetes.'
          fi
      - name: Preserve acceptance evidence
        if: always()
        run: |
          mkdir -p evidence
          kubectl get pods -n dask-acceptance -o wide > evidence/pods.txt 2>&1 || true
          kubectl get daskclusters -n dask-acceptance -o yaml > evidence/clusters.yaml 2>&1 || true
          kubectl cp -n dask-acceptance acceptance-controller:/calrissian evidence/calrissian || true
          cp -r downloads evidence/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-and-candidate-artifacts
          path: evidence
